<!DOCTYPE html>
<html>
    <header>
        <script type="module" src="./script.js"></script>
        <script src="recipes-list.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <title>WackyRecipes</title>
    </header>
    <body>
        <div class="header">
            <a href="index.html" alt="home">Home</a>
            <a href="generate.html" alt="generate" class="generate">GENERATE</a>
            <a href="saved.html" alt="saved">Saved</a>
            <a href="collection.html" alt="collection">Collection</a>
        </div>

        <div class="rollContainer" id="mainContainer">
            <div class="imgBox">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxnQUm0ElSeXg54npyfZCwk2NK0w-JM2PxElAbWsuuWw&s=10">
            </div>
            <div>
                <button class="enter" id="rollButton" style="margin-top: 35px">ROLL RECIPE!</button>
            </div>
            <div style="display: none;" id="rollName">
                <p>[Insert Name]</p>
            </div>
            <div style="display: none; margin-bottom: 10px;" id="expandButton">
                <button class="enter" >Yummy! (see recipe)</button>
            </div>
            <div style="display: none;" id="rerollButton">
                <button class="enter">Yuck! (re-roll)</button>
            </div>
            
           

        </div>
        <div class="rollContainer" style="display: none; left: 5%;" id="sideContainer">
            <div class="imgBox">
                <img>
            </div>

            <div id="recipeName">
                <p>[Insert Name]</p>
            </div>

            <div style="display: flex; justify-content: center;" id="rerollTwo">
                <button class="enter">RE-ROLL!</button>
            </div>
        </div>
        <div id="recipeContainer">
            <h2>Ingredients</h2>
            <p id="ingredients"></p>
            <h2>Instructions</h2>
            <p id="instructions"></p>
        </div>



    </body>


</html>
