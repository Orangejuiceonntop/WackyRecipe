<!DOCTYPE html>
<html>
    <header>
        <script type="module" src="./script.js"></script>
        <script src="recipes-list.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <title>WackyRecipes</title>
    </header>
    <body>
        <div class="header">
            <a href="index.html" alt="home">Home</a>
            <a href="generate.html" alt="generate" class="generate">GENERATE</a>
            <a href="saved.html" alt="saved">Saved</a>
            <a href="collection.html" alt="collection">Collection</a>
        </div>

        <div class="rollContainer" id="mainContainer">
            <div class="imgBox">
                <img>
            </div>
            <div>
                <button class="enter" id="rollButton">ROLL RECIPE!</button>
            </div>
            <div style="display: none;" id="expandButton">

            </div>

                <p>[Rolling...]</p>
            </div>

        </div>
        <div class="rollContainer" style="display: none; left: 4%;" id="sideContainer">
            <div class="imgBox">
                <img>
            </div>

            <div id="recipeName">
                <p>[Insert Name]</p>
            </div>

            <div style="display: flex; justify-content: center;">
                <button class="enter">RE-ROLL!</button>
            </div>
        </div>
        <div id="recipeContainer">
            
        </div>
